[project]
name = "ai-news"
version = "1.0.0"
description = "Site d'actualité statique : résumés factuels multi-sources, sans pub, générés deux fois par jour."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.scripts]
ai-news = "ai_news.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/ai_news/prompts.py" = ["E501"]  # prompts : lignes de texte libre

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ai_news"]
plugins = ["pydantic.mypy"]
