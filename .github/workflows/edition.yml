name: Édition

on:
  schedule:
    # 05:00 et 17:00 UTC = 06h00 et 18h00 à Paris en hiver (07h/19h en été).
    - cron: "0 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config.toml", "deploy/**", "pyproject.toml", "uv.lock"]

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Installer les dépendances
        run: uv sync --frozen --no-dev

      - name: Générer une nouvelle édition
        if: github.event_name != 'push'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run ai-news run

      - name: Régénérer le site (changement de code)
        if: github.event_name == 'push' && hashFiles('data/editions/*.json') != ''
        run: uv run ai-news render

      - name: Versionner l'édition (trace d'audit)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions
          if git diff --cached --quiet; then
            echo "Aucune nouvelle édition à versionner."
            exit 0
          fi
          git commit -m "Édition $(ls -t data/editions/*.json | head -1 | xargs basename -s .json)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Déployer sur Vercel
        if: env.VERCEL_TOKEN != '' && hashFiles('site/index.html') != ''
        run: |
          npm install --global vercel@latest
          vercel deploy site --prod --yes --token "$VERCEL_TOKEN"
